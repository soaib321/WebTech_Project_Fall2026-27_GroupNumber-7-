<!DOCTYPE html>
<html>
<head>
    <title>Tour Manager Login</title>
    <link rel="stylesheet" href="../design/tourManager.css">
</head>
<body>
<div class="top">
    <h1>WanderVista</h1>
    <p>Tour Manager Portal</p>
</div>
<div class="navigation">
    <a href="TourManagerRegistration.html">Register</a>
    <a href="TourManagerLogin.html">Login</a>
    <a href="TourManagerDashboard.html">Dashboard</a>
</div>
<div class="container small-box">
    <h2>Tour Manager Login</h2>
    <form onsubmit="return loginManager()" novalidate>
        <fieldset>
            <legend>Login</legend>
            <table>
                <tr><td>Username</td><td><input type="text" id="LoginUsername"placeholder="Enter Your Username"><small id="LoginUsernameError"></small></td></tr>
                <tr><td>Password</td><td><input type="password" id="LoginPassword" placeholder="Enter Your Password"><small id="LoginPasswordError"></small></td></tr>
            </table>
        </fieldset>
        <p id="ResultText"></p>
        <div class="buttons"><input type="submit" value="Login"></div>
    </form>
    <p class="center">New manager? <a href="TourManagerRegistration.html">Register here</a></p>
</div>
<div class="footer">WanderVista | Tour Manager</div>
<script src="../js/tourManager.js"></script>
</body>
</html>
