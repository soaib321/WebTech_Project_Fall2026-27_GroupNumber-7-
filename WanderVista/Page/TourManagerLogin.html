
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Manager Login</title>
    <link rel="stylesheet" href="../Design/Login/TourLogin.css">
</head>
<body>
<div class="top">
    <div class="brand">
        <img src="../img/logo.svg" class="logo">
        <div>
            <h1>WanderVista</h1>
            <p>Tour Manager Portal</p>
        </div>
    </div>
</div>
<div class="navigation">
    <a href="TourManagerRegistration.html">Register</a>
    <a href="TourManagerLogin.html">Login</a>
    <a href="TourManagerDashboard.html">Dashboard</a>
    <a href="TourPlanning.html">Tour Planning</a>
</div>
<div class="container small-box">
    <h2>Tour Manager Login</h2>
    <form onsubmit="return loginManager()" novalidate>
        <fieldset>
            <legend>Login Information</legend>
            <table>
                <tr><td><label for="LoginUsername">Username:</label></td>
                    <td><input type="text" id="LoginUsername" placeholder="Enter Your Username">
                        <p class="error" id="LoginUsernameError"></p></td></tr>
                <tr><td><label for="LoginPassword">Password:</label></td>
                    <td><input type="password" id="LoginPassword" placeholder="Enter Your Password">
                        <p class="error" id="LoginPasswordError"></p></td></tr>
            </table>
        </fieldset>
        <p id="ResultText"></p>
        <div class="buttons"><input type="submit" value="Login"></div>
    </form>
    <p class="center">New manager? <a href="TourManagerRegistration.html">Register here</a></p>
</div>
<div class="footer">WanderVista | Tour Manager | Created by Swachchho</div>
<script src="../JS/Login/TourLogin.js"></script>
</body>
</html>
