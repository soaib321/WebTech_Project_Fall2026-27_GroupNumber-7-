<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../Design/TouristLogin.css">
    <script src="../JS/TouristLogin.js" defer></script>

    <title>Tourist Login | WanderVista</title>
</head>

<body>

    <div class="container">

        <header class="top">
            <a class="brand" href="../index.html">
                <img src="../img/wandervista-logo.png" alt="WanderVista Logo">
                <span>WanderVista</span>
            </a>

            <nav class="topnav">
                <a href="../index.html">Home</a>
            </nav>
        </header>

        <div class="header">
            <h1>Tourist Login</h1>
            <p>Enter your username and password.</p>
        </div>

        <form onsubmit="return loginAccount('Tourist')" 
              onreset="clearLoginMessage()" novalidate>

            <fieldset>
                <legend>Tourist Account</legend>

                <table>

                    <tr>
                        <td>
                            <label for="LoginUsername">Username</label>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <input type="text" id="LoginUsername"
                                placeholder="Enter username">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="LoginPassword">Password</label>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <input type="password" id="LoginPassword"
                                placeholder="Enter password">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <p class="error" id="LoginMessage"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <input class="primary-button" id="submit"
                                type="submit" value="Login">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <p>
                                New tourist?
                                <a href="TouristRegistration.html">Register here</a>
                            </p>
                        </td>
                    </tr>

                </table>
            </fieldset>

        </form>

        <footer class="footer">
            WanderVista | Offline educational project | HTML, CSS and JavaScript
        </footer>

    </div>

</body>
</html>
