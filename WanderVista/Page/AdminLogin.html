<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Admin Login | WanderVista</title>
    <link href="../Design/AdminLogin.css" rel="stylesheet" />
    <script src="../JS/AdminLogin.js"></script>
</head>

<body class="login-page">
    <header class="login-header"><a class="login-brand" href="../index.html">WanderVista</a>
        <nav class="login-nav"><a href="../index.html">Home</a> | <a href="AdminDashboard.html">Dashboard</a> | <a
                href="AdminRegistration.html">Register</a> | <a aria-current="page" href="AdminLogin.html">Login</a></nav>
    </header>
    <main class="login-main">
        <section class="login-intro">
            <h1>Admin Login</h1>
            <p>Enter your username and password.</p>
        </section>
        <form class="login-form" novalidate="" onsubmit="return loginAccount()">
            <fieldset class="login-section">
                <legend>Admin Account</legend>
                <label for="LoginUsername">Username</label>
                <input id="LoginUsername" placeholder="Enter username" required="" type="text" />
                <label for="LoginPassword">Password</label>
                <input id="LoginPassword" placeholder="Enter password" required="" type="password" />
                <p aria-live="polite" class="login-error" id="LoginMessage"></p>
                <button class="login-button" type="submit">Validate fields</button>
                <p>New admin? <a href="AdminRegistration.html">Register here</a></p>
            </fieldset>
        </form>
    </main>
    <footer class="login-footer">WandaVista | A responsive travel website</footer>
</body>

</html>
