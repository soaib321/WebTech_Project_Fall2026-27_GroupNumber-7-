<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Admin Login | WanderVista</title>
    <link href="../Design/AdminLogin.css" rel="stylesheet" />
    <script defer src="../JS/AdminLogin.js"></script>
</head>

<body>
    <header>
        <img src="../img/logo-mark.svg" alt="WanderVista logo" />
        <h1>WanderVista</h1>
    </header>
    <nav><a href="../index.html">Home</a>
        <a aria-current="page" href="AdminLogin.html">Admin Login</a>
        <a href="AdminRegistration.html">Admin Registration</a>
        <a href="AdminCreateUser.html">Create User</a></nav>
    <main>
        <h2>Admin Login</h2>
        <p>Sign in to manage WanderVista tours, stays, and traveler accounts.</p>
        <form autocomplete="off" novalidate="">
            <fieldset>
                <legend>Admin account</legend>
                <table>
                    <tr><td><label for="LoginUsername">Username</label></td>
                        <td><input id="LoginUsername" placeholder="Enter username" required type="text" />
                            <p id="UsernameError"></p></td></tr>
                    <tr><td><label for="LoginPassword">Password</label></td>
                        <td><input id="LoginPassword" placeholder="Enter password" required type="password" />
                            <p id="PasswordError"></p></td></tr>
                    <tr><td></td><td><label><input id="ShowPassword" type="checkbox" />
                        Show password</label></td></tr>
                </table>
                <p aria-live="polite" id="LoginError" hidden></p>
                <p aria-live="polite" id="LoginSuccess" hidden></p>
                <button type="submit">Login</button>
                <button type="reset">Clear</button>
                <p class="hint">New admin? <a href="AdminRegistration.html">Register here</a></p>
            </fieldset>
        </form>
    </main>
    <footer>WanderVista | Travel Site</footer>
</body>

</html>
